apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: vectorhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: vectorhub/gateway:latest # Placeholder image name
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config-volume
          mountPath: /home/ballerina/Config.toml
          subPath: Config.toml
        env:
        - name: REDIS_HOST
          value: "redis"
      volumes:
      - name: config-volume
        configMap:
          name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: vectorhub
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: gateway
