apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vectorhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: vectorhub/frontend:latest # Placeholder image name
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://gateway:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: vectorhub
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: frontend
