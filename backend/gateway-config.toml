[gateway]
port = 8080
workers = 8
maxConnections = 1000
requestTimeoutMs = 30000
enableCompression = true

[gateway.routing]
strategy = "weighted"
enableFallback = true
maxConcurrentBackends = 3

[backends.qdrant]
urls = ["http://qdrant:6333"]
timeout = 5000
poolSize = 50
weight = 2

[backends.qdrant.circuitBreaker]
failureThreshold = 0.2
resetTimeMs = 10000
timeWindowMs = 10000
minRequestVolume = 5

[backends.milvus]
urls = ["http://milvus:19530"]
timeout = 5000
poolSize = 50
weight = 1

[backends.milvus.circuitBreaker]
failureThreshold = 0.2
resetTimeMs = 10000
timeWindowMs = 10000
minRequestVolume = 5

[backends.weaviate]
urls = ["http://weaviate:8080"]
timeout = 5000
poolSize = 30
weight = 1

[backends.weaviate.circuitBreaker]
failureThreshold = 0.3
resetTimeMs = 15000
timeWindowMs = 10000
minRequestVolume = 5

[observability]
metricsEnabled = true
metricsPort = 9090
tracingEnabled = true
tracingEndpoint = "http://jaeger:14268/api/traces"
logLevel = "INFO"
structuredLogs = true
